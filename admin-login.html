<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login · Kho Kho India</title>
  <link rel="icon" href="images/kho-kho-india-logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#081225;
      --saffron:#ff6a00;
      --saffron-deep:#e24a00;
      --cream:#fbf5ec;
      --muted:#60708a;
      --border:#e6d9c8;
      --radius:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Barlow",sans-serif;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      background:linear-gradient(145deg,#0a1830 0%,#152a52 45%,#0a1830 100%);
      color:#1b2a45;
    }
    .card{
      width:100%;max-width:420px;
      background:#fff;
      border-radius:var(--radius);
      padding:32px 28px;
      box-shadow:0 24px 50px rgba(0,0,0,.35);
      border:1px solid var(--border);
    }
    .logo-row{
      display:flex;align-items:center;gap:12px;
      margin-bottom:8px;
    }
    .logo-row img{height:52px;width:auto;object-fit:contain}
    h1{
      font-family:"Barlow Condensed",sans-serif;
      font-size:1.75rem;
      text-transform:uppercase;
      letter-spacing:1px;
      color:var(--navy);
    }
    .sub{color:var(--muted);font-size:.9rem;margin:6px 0 22px}
    .hint{
      background:var(--cream);
      border:1px dashed var(--border);
      border-radius:8px;
      padding:10px 12px;
      font-size:.82rem;
      color:#4a5568;
      margin-bottom:20px;
      line-height:1.45;
    }
    .hint strong{color:var(--saffron-deep)}
    label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
    input{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:8px;
      font-size:1rem;
      margin-bottom:16px;
      font-family:inherit;
    }
    input:focus{outline:2px solid rgba(255,106,0,.35);border-color:var(--saffron)}
    .err{
      color:#b42318;
      font-size:.85rem;
      margin:-8px 0 12px;
      display:none;
    }
    .err.show{display:block}
    button[type="submit"]{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      background:linear-gradient(135deg,var(--saffron),var(--saffron-deep));
      color:#fff;
      font-weight:700;
      font-size:.88rem;
      letter-spacing:1px;
      text-transform:uppercase;
      cursor:pointer;
      margin-top:4px;
    }
    button[type="submit"]:hover{filter:brightness(1.06)}
    .back{
      display:block;text-align:center;margin-top:18px;
      font-size:.88rem;color:var(--muted);
    }
    .back a{color:var(--saffron);font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <img src="images/kho-kho-india-logo.png" alt="">
      <div>
        <h1>Admin</h1>
      </div>
    </div>
    <p class="sub">Sign in to update events, gallery photos, and About stakeholders.</p>
    <p class="hint"><strong>Demo credentials:</strong> username <code>admin</code> · password <code>khokho2026</code></p>
    <form id="login-form" novalidate>
      <label for="user">Username</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="pass">Password</label>
      <input id="pass" type="password" name="pass" autocomplete="current-password" required>
      <p class="err" id="login-err">Invalid username or password.</p>
      <button type="submit">Log in</button>
    </form>
    <p class="back"><a href="index.html">← Back to website</a></p>
  </div>
  <script>
    var SESSION_KEY = "kkfi_admin_session";
    var DUMMY_USER = "admin";
    var DUMMY_PASS = "khokho2026";

    if (sessionStorage.getItem(SESSION_KEY) === "1") {
      window.location.replace("admin-dashboard.html");
    }

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("user").value.trim();
      var p = document.getElementById("pass").value;
      var err = document.getElementById("login-err");
      if (u === DUMMY_USER && p === DUMMY_PASS) {
        sessionStorage.setItem(SESSION_KEY, "1");
        window.location.replace("admin-dashboard.html");
      } else {
        err.classList.add("show");
      }
    });
  </script>
</body>
</html>
